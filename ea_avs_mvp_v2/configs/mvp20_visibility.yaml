# =============================================================================
# 配置文件 —— mvp20_visibility.yaml
# EA-AVS-MVP v2.0 实验配置文件
# =============================================================================
#
# 使用前请将 habitat.scene_path 和 habitat.navmesh_path 指向实际文件路径。
# 当前已默认指向 habitat-sim 自带的测试场景 apartment_1.glb。
#
# 主要配置段说明：
#   project:           项目名称和随机种子
#   habitat:           Habitat 场景和导航网格路径
#   camera:            相机参数（分辨率、视场角、安装高度）
#   episode:           Episode 数量和采样约束
#   human:             人体参数（姿态类型）
#   candidate_sampling: 候选视角采样参数
#   visibility:        可见性判断的深度范围
#   score_weights:     身体部位评分权重（用于 S_kp）
#   predictive_score:  预测评分 Q_pred 的权重
#   true_score:        真实评分 Q_true 的权重
#   movement:          是否允许不移动
#   distance_score:    距离评分的高斯参数
#   output:            输出控制

project:
  name: "EA-AVS-MVP2.0"
  seed: 42

habitat:
  # 请根据实际环境修改以下路径
  scene_path: "/home/zxf/WorkSpace/code/code/robot/habitat-sim/data/versioned_data/habitat_test_scenes/apartment_1.glb"
  navmesh_path: "/home/zxf/WorkSpace/code/code/robot/habitat-sim/data/versioned_data/habitat_test_scenes/apartment_1.navmesh"
  use_habitat_lab: false

camera:
  width: 640
  height: 480
  hfov_deg: 90
  vfov_deg: 60
  camera_height: 1.2

episode:
  num_episodes: 20
  min_robot_human_distance: 1.5
  max_robot_human_distance: 4.0
  max_sampling_tries: 100

human:
  pose_type: "standing"
  base_height_offset: 0.0

candidate_sampling:
  radii: [1.5, 2.0, 2.5]
  angles_deg: [-135, -90, -45, 0, 45, 90, 135, 180]
  min_distance_to_human: 1.2
  max_distance_to_human: 3.0
  max_geodesic_distance: 6.0

visibility:
  min_depth: 0.5
  max_depth: 5.0

score_weights:
  torso: 0.4
  lower_body: 0.4
  head: 0.2

predictive_score:
  w_kp_pred: 0.60
  w_center_pred: 0.20
  w_dist_pred: 0.20
  w_move: 0.20

true_score:
  w_kp_true: 0.70
  w_center_true: 0.15
  w_dist_true: 0.15

movement:
  allow_stay: true
  stay_margin: 0.0

distance_score:
  optimal_distance: 2.0
  sigma: 0.7

output:
  save_images: true
  save_candidate_json: true
  save_csv: true
