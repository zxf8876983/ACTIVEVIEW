# Elderly Action Queries & Matching Rules for BABEL Annotation Filtering
# =========================================================================
# Target: 5 classes of elderly-oriented indoor action scenarios for ActiveView NBV.
# Prohibited for v7.0 MVP: walking, running, jumping, dance, sports, complex multi-person.

action_classes:
  standing:
    include:
      - "stand"
      - "standing"
      - "stand still"
      - "stand up"
    exclude:
      - "handstand"
      - "stand on one leg"
      - "stand on left foot"
      - "stand on right foot"
      - "walk"
      - "run"
      - "dance"
      - "jump"
      - "kick"

  sitting:
    include:
      - "sit"
      - "sitting"
      - "sit down"
      - "seated"
    exclude:
      - "sit up"
      - "babysit"
      - "walk"
      - "run"
      - "dance"

  bending:
    include:
      - "bend"
      - "bending"
      - "bend down"
      - "pick"
      - "pick up"
      - "picking"
      - "take/pick something up"
    exclude:
      - "unbend"
      - "backbend"
      - "walk"
      - "run"
      - "dance"

  reaching:
    include:
      - "reach"
      - "reaching"
      - "reach for"
      - "reach out"
    exclude:
      - "breach"
      - "walk"
      - "run"
      - "dance"

  fall_related:
    high_confidence_include:
      - "fall"
      - "falling"
      - "fall down"
      - "fallen"
      - "fall to the ground"
      - "fall back"
      - "fall forward"
      - "trip"
      - "slip and fall"
      - "collapse"
    weak_include:
      - "lie"
      - "lying"
      - "lie down"
      - "lie on floor"
      - "prone"
      - "supine"
    exclude:
      - "sleep"
      - "sleeping"
      - "rest in bed"
      - "lying on bed"
      - "sunbathing"
      - "exercise floor pose"
      - "exercise"
      - "stretch"
      - "sit up"
      - "push up"
      - "yoga"
