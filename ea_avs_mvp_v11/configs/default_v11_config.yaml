# ACTIVEVIEW v10.0 Default Configuration
version: "10.0.0"
description: "RGB-D Driven Task-aware Active View Selection for Human Action Recognition"

scene:
  scene_id: "apartment_1"
  scene_path: "robot/habitat-sim/data/versioned_data/habitat_test_scenes/apartment_1.glb"
  enable_physics: true
  seed: 42

camera:
  width: 640
  height: 480
  hfov_deg: 90.0
  camera_height: 1.50
  clip_near: 0.01
  clip_far: 10.0

human:
  avatar_name: "neutral_0"
  assets_root: "assets/humanoids/neutral_0"
  ground_offset: 0.0
  default_position: [1.5, -1.60, 4.0]
  default_yaw_deg: 0.0

motion:
  action_classes:
    - "standing"
    - "walking"
    - "sitting"
    - "bending"
    - "reaching"
    - "falling"
  motion_assets_dir: "assets/motions/converted"

viewpoint:
  radii: [1.5, 2.0, 2.5]
  num_angles: 8
  camera_height: 1.50
  ground_height: -1.60

  min_distance_to_human: 1.0
  max_distance_to_human: 3.5

dataset_generation:
  output_dir: "datasets/v10"
  save_format_depth: "npy"
  frame_step: 5
  max_frames_per_motion: 10
  save_gt_skeleton: true
