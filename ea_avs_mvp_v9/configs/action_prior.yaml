# ACTIVEVIEW v9.0 动作先验配置 (configs/action_prior.yaml)
# 定义各动作的关键解剖观察区域、推荐视角朝向偏好、最优距离及增益权重

actions:
  fall:
    description: "跌倒状态：需观察全身着地姿态、躯干骨盆高度与地面相对接触"
    critical_regions: ["torso", "pelvis", "head", "lower_body"]
    preferred_angle_range: [20.0, 75.0]  # 侧前方偏角观察展开的人体轮廓
    optimal_distance: 2.5               # 摔倒需更大视场以覆盖展开的人体
    region_weights:
      torso: 0.30
      pelvis: 0.30
      head: 0.20
      lower_body: 0.20
    aspect_weight: 0.25
    distance_weight: 0.20

  sitting:
    description: "静坐状态：需观察下肢膝髋弯曲与座椅表面交互"
    critical_regions: ["lower_body", "pelvis", "torso"]
    preferred_angle_range: [40.0, 90.0]  # 侧方观察膝关节弯曲与座椅贴合
    optimal_distance: 2.0
    region_weights:
      lower_body: 0.45
      pelvis: 0.30
      torso: 0.25
      head: 0.00
    aspect_weight: 0.25
    distance_weight: 0.15

  standing:
    description: "站立状态：需观察直立姿态与面部正面端正度"
    critical_regions: ["torso", "head", "upper_body", "lower_body"]
    preferred_angle_range: [0.0, 30.0]   # 正面端正观察
    optimal_distance: 2.0
    region_weights:
      torso: 0.30
      head: 0.30
      upper_body: 0.20
      lower_body: 0.20
    aspect_weight: 0.20
    distance_weight: 0.15

  bending:
    description: "弯腰状态：需侧向捕获脊柱弯曲度、躯干前倾角与重心变化"
    critical_regions: ["torso", "pelvis", "head"]
    preferred_angle_range: [45.0, 90.0]  # 侧向观察脊柱剖面与前倾
    optimal_distance: 2.2
    region_weights:
      torso: 0.45
      pelvis: 0.35
      head: 0.20
      lower_body: 0.00
    aspect_weight: 0.30
    distance_weight: 0.15

  reaching:
    description: "伸手抓取状态：需侧前方捕获双臂延伸与目标操作轨迹"
    critical_regions: ["upper_body", "torso", "head"]
    preferred_angle_range: [15.0, 60.0]  # 侧前方观察手臂前伸与抓取空间
    optimal_distance: 1.8
    region_weights:
      upper_body: 0.50
      torso: 0.30
      head: 0.20
      lower_body: 0.00
    aspect_weight: 0.25
    distance_weight: 0.15
