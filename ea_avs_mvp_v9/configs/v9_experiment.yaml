# ACTIVEVIEW v9.0 实验对比参数配置 (configs/v9_experiment.yaml)

experiment:
  name: "v9_action_conditioned_view_scoring"
  evaluation_mode: "oracle"
  pose_source: "oracle"
  actions_to_compare: ["fall", "sitting", "standing", "bending", "reaching"]
  strategies: ["random", "nearest", "geometry_best", "action_conditioned"]
  output_dir: "visualizations/v9_demo"
  runs_dir: "runs/v9_demo"

scene:
  scene_id: "apartment_1"
  floor_height: -1.60

sampling:
  radii: [1.5, 2.0, 2.5, 3.0]
  num_angles: 8
  camera_height: 1.2
  ground_height: -1.60

scoring:
  w_geometry: 0.60
  w_action: 0.40
