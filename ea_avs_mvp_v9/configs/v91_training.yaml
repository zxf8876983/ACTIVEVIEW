# ACTIVEVIEW v9.1 人体状态感知学习型视角打分模型训练配置 (configs/v91_training.yaml)

training:
  seed: 42
  num_episodes: 200            # 合成/采样训练 episode 数量
  val_ratio: 0.2               # 验证集划分比例
  batch_size: 16               # Episode 批大小
  num_epochs: 40               # 训练轮数
  learning_rate: 0.001         # 优化器学习率
  weight_decay: 1e-4           # L2 正则化权重
  ranking_margin: 0.1          # Pairwise 排序间隔 (margin)
  loss_type: "combined"        # "pairwise", "mse", "combined"
  ranking_loss_weight: 1.0     # 排序损失权重
  regression_loss_weight: 0.5  # 回归损失权重

model:
  pose_input_dim: 49           # 16 关节 x 3 + 1 yaw 朝向角
  pose_hidden_dim: 64
  pose_embed_dim: 32

  view_input_dim: 13           # 距离, 角度sin/cos, 覆盖率, 损失, 投影面积, 7 大部位可见性
  view_hidden_dim: 64
  view_embed_dim: 32

  fusion_hidden_dims: [64, 32]
  dropout: 0.1

paths:
  checkpoint_dir: "checkpoints"
  checkpoint_name: "model_checkpoint.pth"
  results_dir: "results"
  training_curve_name: "training_curve.png"
