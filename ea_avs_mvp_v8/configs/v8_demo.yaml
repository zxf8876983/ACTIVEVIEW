# ACTIVEVIEW v8.0 Local Active View Planning 演示配置 (configs/v8_demo.yaml)

scene:
  scene_id: "apartment_1"
  scene_path: "robot/habitat-sim/data/versioned_data/habitat_test_scenes/apartment_1.glb"
  floor_height: -1.60

human:
  avatar: "neutral_0"
  avatar_name: "neutral_0"
  action: "fall_related"
  motion_id: "fall_related_3522"
  initial_pose:
    position: [1.5, -1.60, 4.0]
    yaw_deg: 0.0
    scale: 1.0

robot:
  initial_pose:
    position: [1.5, -1.60, 6.8]
    yaw_deg: 0.0
  ground_height: -1.60

camera:
  camera_height: 1.2
  hfov_deg: 90.0
  width: 640
  height: 480
  clip_near: 0.01
  clip_far: 10.0

viewpoint:
  radii: [1.5, 2.0, 2.5, 3.0]
  num_angles: 8
  min_radius: 1.5
  max_radius: 3.0
  camera_height: 1.2
  ground_height: -1.60
  check_navmesh: true
  check_path_reachability: true
  check_line_of_sight: true
  check_human_visibility: true
  min_projected_area_ratio: 0.015

evaluation:
  optimal_distance: 2.0
  max_distance: 4.5
  w1_visibility: 0.40
  w2_pose_coverage: 0.30
  w3_distance: 0.15
  w4_occlusion: 0.15
  strategy: "geometry_best"

simulation:
  output_dir: "visualizations/v8_demo"
  runs_dir: "runs/v8_demo"
