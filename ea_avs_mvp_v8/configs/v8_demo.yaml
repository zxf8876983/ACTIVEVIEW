  num_angles: 8
  min_radius: 1.0
  max_radius: 4.0
  camera_height: 1.2
  ground_height: -1.60
  filter_unreachable: true

simulation:
  fps: 10.0
  playback_fps: 30.0
  num_frames: 10
  output_dir: "visualizations/v8_demo"
  runs_dir: "runs/v8_demo"
