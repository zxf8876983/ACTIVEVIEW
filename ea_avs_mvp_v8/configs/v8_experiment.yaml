# ACTIVEVIEW v8.2 最终实验基准配置 (configs/v8_experiment.yaml)

experiment:
  name: "v8_local_active_view_baseline"
  evaluation_mode: "oracle"     # "oracle" (真值驱动基准) 或 "estimated"
  pose_source: "oracle"         # "oracle" (GT 16关节) 或 "estimated"
  strategy: "geometry_best"     # "geometry_best", "nearest", "random"
  output_dir: "visualizations/v8_demo"
  runs_dir: "runs/v8_demo"

scene:
  scene_id: "apartment_1"
  scene_path: "robot/habitat-sim/data/versioned_data/habitat_test_scenes/apartment_1.glb"
  floor_height: -1.60

human:
  avatar_name: "neutral_0"
  action: "fall_related"
  motion_id: "fall_related_3522"
  initial_pose:
    position: [1.5, -1.60, 4.0]
    yaw_deg: 0.0

robot:
  initial_pose:
    position: [1.5, -1.60, 6.8]
    yaw_deg: 0.0
  ground_height: -1.60

camera:
  camera_height: 1.2
  hfov_deg: 90.0
  width: 640
  height: 480
  clip_near: 0.01
  clip_far: 10.0

sampling:
  mode: "local_polar_grid"
  radii: [1.5, 2.0, 2.5, 3.0]
  num_angles: 8
  camera_height: 1.2
  ground_height: -1.60
  face_human: true

constraints:
  check_navmesh: true
  check_path_reachability: true
  check_line_of_sight: true
  check_human_visibility: true
  min_projected_area_ratio: 0.015

evaluation:
  optimal_distance: 2.0
  max_distance: 4.5
  w1_visibility: 0.40
  w2_pose_coverage: 0.30
  w3_distance: 0.15
  w4_visibility_loss: 0.15
