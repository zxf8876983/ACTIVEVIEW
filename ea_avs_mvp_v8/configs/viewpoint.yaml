# ACTIVEVIEW v8.0 局部主动视点规划配置 (configs/viewpoint.yaml)

sampling:
  mode: "local_polar_grid"     # 以人体为中心的局部极坐标网格采样
  radii: [1.5, 2.0, 2.5, 3.0]  # 局部采样距离半径列表 (米, 1.5m - 3.0m)
  num_angles: 8                # 水平角度离散数量 (0, 45, 90, ..., 315 度)
  camera_height: 1.2           # 机器人相机安装高度 (米)
  ground_height: -1.60         # 机器人底盘物理地面标高 (米)
  face_human: true             # 自动计算偏航角使相机正对人体中心

constraints:
  check_navmesh: true          # NavigationConstraint: NavMesh 可行走域检查
  check_path_reachability: true # NavigationConstraint: 机器人到候选视点的路径连通性
  check_line_of_sight: true    # LineOfSightConstraint: 视线光线追踪遮挡检查
  check_human_visibility: true # HumanVisibilityConstraint: 人体是否进入相机 FOV 视锥
  max_snap_distance: 0.5       # NavMesh 对齐最大允许容差 (米)

evaluation:
  optimal_distance: 2.0        # 最优观测距离基准 (米)
  max_distance: 4.5            # 最大有效观测距离 (米)
  w1_visibility: 0.5           # 人体整体可见性权重
  w2_pose_coverage: 0.3        # 16 关节骨骼姿态覆盖率权重
  w3_distance: 0.2             # 距离偏离惩罚权重
