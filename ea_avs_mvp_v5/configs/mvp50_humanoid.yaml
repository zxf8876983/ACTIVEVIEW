# =============================================================================
# 配置文件 —— mvp50_humanoid.yaml
# EA-AVS-MVP v5.0 实验配置文件 —— 真实 Habitat Humanoid + RGB-D 渲染
# =============================================================================
#
# 中文名称：面向老人动作感知的移动机器人主动视角选择 v5.0 —— 真实 Humanoid 版本
#
# v5.0 相比 v4.0 的核心新增：
#   真实可渲染 Habitat Humanoid（含人体表面 / 自遮挡 / 动作状态），
#   机器人 RBG-D 相机真实观察该人体，并保留 GT-State 支路接入 v4.0 NBV。
#
# v4.0 的动作权重 / 评分权重 / occlusion 参数一并复制到本配置。

project:
  name: "EA-AVS-MVP5.0"
  seed: 42

habitat:
  scene_path: "/home/zxf/WorkSpace/code/code/robot/habitat-sim/data/versioned_data/habitat_test_scenes/apartment_1.glb"
  navmesh_path: "/home/zxf/WorkSpace/code/code/robot/habitat-sim/data/versioned_data/habitat_test_scenes/apartment_1.navmesh"
  use_habitat_lab: false
  enable_physics: true   # Humanoid 是 articulated agent，ray casting 亦依赖 physics

camera:
  width: 640
  height: 480
  hfov_deg: 90
  camera_height: 1.2
  # depth 传感器近/远裁剪面（保证深度为公制真实距离）
  clip_near: 0.01
  clip_far: 10.0

humanoid:
  enabled: true
  # ⚠ 必须指向本机官方 habitat_humanoids 资源根目录
  assets_root: "/home/zxf/WorkSpace/code/code/robot/habitat-lab/data/versioned_data/habitat_humanoids"
  avatar_name: "neutral_0"

  # official / custom_motion
  motion_mode: "official"

  # smoke test 必须支持 standing；walking 用于验证动画链路
  default_pose: "standing"
  supported_official_states:
    - standing
    - walking

  # 后续动作素材（AMASS/SMPL-X 加工）准备后开启
  research_pose_files:
    sitting: null
    bending: null
    lying_fallen: null

  # Humanoid base_yaw 随机化候选（8 方向）
  yaw_candidates_deg: [0, 45, 90, 135, 180, -135, -90, -45]

  # 模型 forward 轴（由 debug_humanoid_forward_axis.py 一次性确认）
  # 允许值：+Z / -Z / +X / -X
  forward_axis: "+Z"

  # 正式模式：GT skeleton 必须 15 个全部来自 Humanoid（直接 link + link_derived），
  # fallback=0，否则报错
  strict_gt_skeleton: true

  # 语义传感器。v5.0 第三轮已实现：显式给 Humanoid link/visual scene node 设
  # semantic_id 后 semantic 图会非 0（实测）。默认开启用于验证。
  semantic_enabled: true
  semantic_id: 100

  # motion / pose 缺失时禁止静默使用错误动作
  strict_motion_loading: true

  # Humanoid 放置时与地面的高度修正（默认由资源/config/API 推导）
  base_height_offset: 0.0

  # self-occlusion raycast 能力状态（v5.0 closure 实测 8 环绕角度）
  # 实测：humanoid_self_case=1（pelvis 被 torso 遮挡），target_surface 机制存在
  #       （head/wrist 命中自身 link 但差值<容差故为 none，计 0），
  #       environment=23。因 target_surface 无严格样例 → inconclusive。
  raycast_self_occlusion_status: "inconclusive"
  raycast_self_occlusion_validation: "debug_humanoid_self_occlusion.py 8 角：self=1 样例，target_surface 机制存在但 count=0 → inconclusive；无需更多姿态"

# v5.0 Humanoid 渲染/骨架验证阈值
humanoid_validation:
  min_pixel_count: 100       # Humanoid 可见像素阈值（semantic 或 GT 锚定 depth proxy）
  min_depth_valid_ratio: 0.5 # Humanoid 区域内有效 metric depth 比例
  max_short_walk_displacement: 2.0  # 短 walking smoke 允许的最大位移（米）
  depth_match_tolerance: 0.5 # GT 锚定 depth proxy 中 |depth - z| 匹配容差（米）

episode:
  num_episodes: 20
  min_robot_human_distance: 1.5
  max_robot_human_distance: 4.0
  max_sampling_tries: 100
  randomize_human_yaw: true

candidate_sampling:
  radii: [1.5, 2.0, 2.5]
  angles_deg: [-135, -90, -45, 0, 45, 90, 135, 180]
  min_distance_to_human: 1.2
  max_distance_to_human: 3.0
  max_geodesic_distance: 6.0

visibility:
  min_depth: 0.5
  max_depth: 5.0

# ===== v4.0 沿用配置段 =====
occlusion:
  enabled: true
  ray_epsilon: 0.05
  target_tolerance: 0.08
  min_hit_distance: 0.05
  max_raycast_error_rate: 0.10

score_weights:
  torso: 0.40
  lower_body: 0.40
  head: 0.10
  arms: 0.10

action_part_weights:
  standing:
    torso: 0.35
    lower_body: 0.35
    head: 0.20
    arms: 0.10
  sitting:
    torso: 0.40
    lower_body: 0.45
    head: 0.10
    arms: 0.05
  lying_fallen:
    torso: 0.40
    lower_body: 0.35
    head: 0.20
    arms: 0.05
  bending:
    torso: 0.45
    lower_body: 0.35
    head: 0.10
    arms: 0.10

orientation_score:
  preferred_angle_deg: 45
  sigma_deg: 35

predictive_score:
  w_action_occ_pred: 0.50
  w_orient_pred: 0.15
  w_center_pred: 0.10
  w_dist_pred: 0.10
  w_move: 0.15

true_score:
  w_action_occ_true: 0.60
  w_orient_true: 0.15
  w_center_true: 0.10
  w_dist_true: 0.15

movement:
  allow_stay: true
  stay_margin: 0.0

distance_score:
  optimal_distance: 2.0
  sigma: 0.7

oracle:
  enabled: true
  min_depth_coverage: 0.8   # Oracle 只比较 depth 来源且 depth_coverage 达标的候选

output:
  save_images: true
  save_depth: true
  save_debug_json: true
  save_video: false
