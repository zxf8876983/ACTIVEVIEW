experiment:
  id: EXP010
  name: skeleton_policy_transformer
  status: PLANNED

model:
  type: skeleton_policy_transformer
  skeleton_shape: [3, 30, 17]
  token_count: 510
  d_model: 128
  encoder_layers: 2
  encoder_heads: 4
  candidate_cross_attention_layers: 1

training:
  seed: 42
  epochs: 100
  patience: 10
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  episodes_per_record: 16

sampler:
  type: record_balanced

loss:
  lambda_reg: 1.0
  lambda_rank: 1.0
  tau: 0.5
  lambda_gap: 0.0

geometry:
  source: frozen_stage_c_v0
  candidate_geometry_dim: 11

evaluation:
  split: val
  test_used: false
  primary_accuracy_target: 0.6691027382569529
  primary_mean_regret_target: 1.3779727850210138
