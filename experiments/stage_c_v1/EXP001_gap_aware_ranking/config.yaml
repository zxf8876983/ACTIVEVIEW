experiment:
  id: EXP001
  name: gap_aware_ranking

model:
  type: set_ranker

training:
  seed: 42
  epochs: 100
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  episodes_per_record: 16

loss:
  lambda_reg: 1.0
  lambda_rank: 1.0
  tau: 0.5
  lambda_gap: 1.0
  tau_gap: 1.0
  max_gap_weight: 10.0

evaluation:
  split: val
