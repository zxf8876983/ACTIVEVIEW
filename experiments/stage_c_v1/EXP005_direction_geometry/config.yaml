experiment:
  id: EXP005
  name: direction_geometry
  status: PLANNED

model:
  type: set_ranker

training:
  seed: 42
  epochs: 100
  patience: 10
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  episodes_per_record: 16

sampler:
  type: record_balanced

loss:
  lambda_reg: 1.0
  lambda_rank: 1.0
  tau: 0.5
  lambda_gap: 0.0

geometry:
  variant: direction_geometry
  candidate_geometry_dim: 15
  added: [azimuth_rank, azimuth_deviation_from_set_center, nearest_angular_neighbor_distance, angular_local_density]

evaluation:
  split: val
  test_used: false
