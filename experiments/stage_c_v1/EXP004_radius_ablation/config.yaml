experiment:
  id: EXP004
  name: radius_ablation
  status: PLANNED

model:
  type: set_ranker

training:
  seed: 42
  epochs: 100
  patience: 10
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  episodes_per_record: 16

sampler:
  type: record_balanced

loss:
  lambda_reg: 1.0
  lambda_rank: 1.0
  tau: 0.5
  lambda_gap: 0.0

geometry:
  variant: radius_ablation
  candidate_geometry_dim: 10
  removed: [current_radius_m, candidate_radius_m, delta_radius_m, radius_zscore, radius_rank, delta_radius_normalized]

evaluation:
  split: val
  test_used: false
