# =============================================================================
# 配置文件 —— mvp30_action_aware.yaml
# EA-AVS-MVP v3.0 实验配置文件 —— 动作感知导向主动视角选择
# =============================================================================
#
# v3.0 新增配置段：
#   human.pose_types:           支持的姿态类型列表
#   human.yaw_candidates_deg:  人体朝向候选角度
#   action_part_weights:        不同姿态的动作关键部位权重
#   orientation_score:          朝向评分配置（偏好角度、标准差）
#   predictive_score:           预测评分权重（含 w_action_part_pred, w_orient_pred）
#   true_score:                 真实评分权重（含 w_action_part_true, w_orient_true）

project:
  name: "EA-AVS-MVP3.0"
  seed: 42

habitat:
  scene_path: "/home/zxf/WorkSpace/code/code/robot/habitat-sim/data/versioned_data/habitat_test_scenes/apartment_1.glb"
  navmesh_path: "/home/zxf/WorkSpace/code/code/robot/habitat-sim/data/versioned_data/habitat_test_scenes/apartment_1.navmesh"
  use_habitat_lab: false

camera:
  width: 640
  height: 480
  hfov_deg: 90
  vfov_deg: 60
  camera_height: 1.2

episode:
  num_episodes: 20
  min_robot_human_distance: 1.5
  max_robot_human_distance: 4.0
  max_sampling_tries: 100
  randomize_pose_type: true
  randomize_human_yaw: true

human:
  pose_types: ["standing", "sitting", "lying_fallen", "bending"]
  default_pose_type: "standing"
  base_height_offset: 0.0
  yaw_candidates_deg: [0, 45, 90, 135, 180, -135, -90, -45]

candidate_sampling:
  radii: [1.5, 2.0, 2.5]
  angles_deg: [-135, -90, -45, 0, 45, 90, 135, 180]
  min_distance_to_human: 1.2
  max_distance_to_human: 3.0
  max_geodesic_distance: 6.0

visibility:
  min_depth: 0.5
  max_depth: 5.0

# 默认关键点组权重，仅作为 fallback（当 action_part_weights 中找不到对应姿态时使用）
score_weights:
  torso: 0.40
  lower_body: 0.40
  head: 0.10
  arms: 0.10

# 不同姿态/动作状态对应的动作关键部位权重
# 权重设计原则：哪种身体部位对判断该动作最重要，就赋予更高权重
action_part_weights:
  standing:
    torso: 0.35
    lower_body: 0.35
    head: 0.20
    arms: 0.10
  sitting:
    torso: 0.40
    lower_body: 0.45
    head: 0.10
    arms: 0.05
  lying_fallen:
    torso: 0.40
    lower_body: 0.35
    head: 0.20
    arms: 0.05
  bending:
    torso: 0.45
    lower_body: 0.35
    head: 0.10
    arms: 0.10

# 候选视角相对人体朝向的评分配置
orientation_score:
  preferred_angle_deg: 45
  sigma_deg: 35
  front_score: 0.8
  side_score: 0.7
  back_score: 0.2

predictive_score:
  w_action_part_pred: 0.45
  w_orient_pred: 0.20
  w_center_pred: 0.15
  w_dist_pred: 0.15
  w_move: 0.15

true_score:
  w_action_part_true: 0.50
  w_orient_true: 0.20
  w_center_true: 0.15
  w_dist_true: 0.15

movement:
  allow_stay: true
  stay_margin: 0.0

distance_score:
  optimal_distance: 2.0
  sigma: 0.7

output:
  save_images: true
  save_candidate_json: true
  save_csv: true
